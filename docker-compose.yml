services:
  db:
    image: postgres:17
    container_name: flyrank-postgres
    environment:
      POSTGRES_USER: flyrank
      POSTGRES_PASSWORD: flyrank_dev_password
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - flyrank-postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyrank -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

volumes:
  flyrank-postgres-data:
